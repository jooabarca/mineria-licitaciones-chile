name: Actualizar datos

on:
  schedule:
    - cron: "0 20 * * *"        # 20:00 UTC (~16:00-17:00 en Chile); Datos Abiertos publica 12:00-14:00 hora de Chile
  workflow_dispatch:
    inputs:
      backfill:
        description: "Re-descargar los 24 meses completos (histórico)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Descargar, filtrar y consolidar
        run: |
          if [ "${{ inputs.backfill }}" = "true" ]; then
            python pipeline/build.py --backfill
          else
            python pipeline/build.py
          fi

      - name: Publicar cambios en data/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "datos: actualización $(date -u +%Y-%m-%d)"
            git push
          fi
